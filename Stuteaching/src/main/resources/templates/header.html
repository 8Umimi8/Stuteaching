<header class="header" th:fragment="header">
    <div class="brand">

        <div class="logo-group">
            <img th:src="@{/img/logo.jpg}" alt="Stutyching ロゴ">
        </div>

        <nav class="nav-menu">
            <ul>
                <li><a th:href="@{/teacher-list}"><i class="fas fa-home"></i> マッチ</a></li>
                <li><a th:href="@{/chat}"><i class="fas fa-comments"></i> トーク</a></li>
                <li><a th:href="@{/schedule}"><i class="fas fa-clock"></i> 勉強時間管理</a></li>
                <li><a th:href="@{/account/profile}"><i class="fas fa-user"></i> アカウント詳細</a></li>
            </ul>
        </nav>

        <div class="user-actions">

            <!-- 通知ボタン -->
            <a href="#" class="icon-btn" id="notifyBtn">
                <i class="fas fa-bell"></i>
            </a>

            <div class="notification-panel" id="notificationPanel">
                <div class="notification-title">通知</div>

                <ul class="notification-list" id="notificationList">
                    <!-- JS で通知を追加 -->
                </ul>
            </div>

            <a href="#" class="profile-btn">
                <div class="profile-icon"><i class="fas fa-user"></i></div>
            </a>

            <button class="hamburger"><i class="fas fa-bars"></i></button>
        </div>
    </div>
</header>
