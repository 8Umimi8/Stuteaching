<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新規登録</title>
  <link rel="stylesheet" th:href="@{/css/regist.css}">
</head>
<body>
  <main class="card" role="main" aria-labelledby="regist-title">
    <h1 id="regist-title">新規登録</h1>

    <form id="regist-form" th:action="@{/user/insert}" th:object="${UserDTO}" method="post">

      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" class="input" placeholder="sutatin@teaching.com" th:value="*{email}" required />
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" class="input" placeholder="パスワード"  minlength="8"  th:value="*{password}" required/>
      </div>

      <div class="field">
        <label for="password_again">パスワードの確認</label>
        <input id="password_again" name="password_again" type="password" class="input" placeholder="パスワード" 
          minlength="8" th:value="*{password}" required/>
      </div>

      <div class="field">
        <label for="name">表示名</label>
        <input  id="name" name="user_name" type="text" class="input" placeholder="スタチン太郎"  th:field="*{user_name}" />
        <div></div>
      </div>

     <!-- 生年月日 -->
<div class="field">
  <label>生年月日</label>
  <input type="date" th:field="*{birthday}" class="form-control w-auto me-2" th:value="*{birthday}">
</div>

      <!-- 性別 -->
      <div class="field" th:value="*{gender}">
        <label for="gender">性別</label>
        <select id="gender" name="gender" required>
          <option value="">選択してください</option>
          <option value="1">男性</option>
          <option value="2">女性</option>
          <option value="3">その他</option>
        </select>
      </div>

      <!-- 役職 -->
      <div class="field" th:value="*{role}">
        <label for="role">役職</label>
        <select id="role" name="role" required>
          <option value="">選択してください</option>
          <option value="1">生徒</option>
          <option value="2">先生</option>
        </select>
      </div>
      <div class="field" id="subject-field" style="display: none;">
        <label for="subject">担当教科</label>
        <select id="subject" name="subject">
          <option value="">選択してください</option>
          <option value="1">国語</option>
          <option value="2">数学</option>
          <option value="3">英語</option>
          <option value="4">理科</option>
          <option value="5">社会</option>
        </select>
      </div>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn">登録</button>
    </form>

    <div class="footer">
      <a th:href="@{/login.html}">ログイン</a>
    </div>
  </main>

  <script>
  document.addEventListener("DOMContentLoaded", () => {
    /* ------------------------------
       パスワード一致チェック
    ------------------------------ */
    const form = document.getElementById("regist-form");
    const pw = document.getElementById("password");
    const pw2 = document.getElementById("password_again");
    const error = document.getElementById("error");

    const role = document.getElementById("role");
    const subjectField = document.getElementById("subject-field");

    // 🔸 役職変更イベント
    role.addEventListener("change", () => {
      if (role.value === "2") {
        subjectField.style.display = "block";
      } else {
        subjectField.style.display = "none";
      }
    });

    // 🔸 パスワード一致チェック
    form.addEventListener("submit", (e) => {
      if (pw.value !== pw2.value) {
        e.preventDefault();
        error.textContent = "パスワードが一致しません";
        pw2.focus();
      }
    });
  });
</script>

</body>

</html>
