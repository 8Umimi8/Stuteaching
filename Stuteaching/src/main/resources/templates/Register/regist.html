<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新規登録</title>
  <link rel="stylesheet" th:href="@{/css/regist.css}">
</head>
<body>
  <main class="card" role="main" aria-labelledby="regist-title">
    <h1 id="regist-title">新規登録</h1>

    <form id="regist-form" th:action="@{/user/insert}" th:object="${UserDTO}" method="post">

      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" class="input" placeholder="sutatin@teaching.com" required />
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" class="input" placeholder="パスワード" required minlength="8" />
      </div>

      <div class="field">
        <label for="password_again">パスワードの確認</label>
        <input id="password_again" name="password_again" type="password" class="input" placeholder="パスワード" required
          minlength="8" />
      </div>

      <div class="field">
        <label for="name">表示名</label>
        <input id="name" name="user_name" type="text" class="input" placeholder="スタチン太郎" required />
      </div>

     <!-- 生年月日 -->
<div class="field">
  <label>生年月日</label>
  <input type="date" th:field="*{birthday}" class="form-control w-auto me-2">
</div>

      <!-- 性別 -->
      <div class="field">
        <label for="gender">性別</label>
        <select id="gender" name="gender" required>
          <option value="">選択してください</option>
          <option value="1">男性</option>
          <option value="2">女性</option>
          <option value="3">その他</option>
        </select>
      </div>

      <!-- 役職 -->
      <div class="field">
        <label for="role">役職</label>
        <select id="role" name="role" required>
          <option value="">選択してください</option>
          <option value="1">生徒</option>
          <option value="2">先生</option>
        </select>
      </div>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
      <button type="submit" class="btn">登録</button>
    </form>

    <div class="footer">
      <a th:href="@{/login.html}">ログイン</a>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      /* ------------------------------
         パスワード一致チェック
      ------------------------------ */
      const form = document.getElementById("regist-form");
      const pw = document.getElementById("password");
      const pw2 = document.getElementById("password_again");
      const error = document.getElementById("error");

      form.addEventListener("submit", (e) => {
        if (pw.value !== pw2.value) {
          e.preventDefault();
          error.textContent = "パスワードが一致しません";
          pw2.focus();
        }
      });
    });
  </script>

</body>

</html>
