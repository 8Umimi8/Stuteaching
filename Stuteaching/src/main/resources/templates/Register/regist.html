<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新規登録</title>
  <link rel="stylesheet" href="../css/regist.css">
</head>

<body>
  <main class="card" role="main" aria-labelledby="regist-title">
    <h1 id="regist-title">新規登録</h1>

    <form id="regist-form" action="agreement.html" method="get">

      <div class="field">
        <label for="email">メールアドレス</label>
        <input id="email" name="email" type="email" class="input" placeholder="sutatin@teaching.com" required />
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <input id="password" name="password" type="password" class="input" placeholder="パスワード" required minlength="8" />
      </div>

      <div class="field">
        <label for="password_again">パスワードの確認</label>
        <input id="password_again" name="password_again" type="password" class="input" placeholder="パスワード" required
          minlength="8" />
      </div>

      <div class="field">
        <label for="name">表示名</label>
        <input id="name" name="name" type="text" class="input" placeholder="スタチン太郎" required />
      </div>

      <!-- 生年月日 -->
      <div class="bday-group">
        <label>生年月日</label>
        <div class="bday-selects">
          <select id="year" name="bday-year" required>
            <option value="">年</option>
          </select>

          <select id="month" name="bday-month" required>
            <option value="">月</option>
          </select>

          <select id="day" name="bday-day" required>
            <option value="">日</option>
          </select>
        </div>
      </div>

      <!-- 性別 -->
      <div class="field">
        <label for="sex">性別</label>
        <select id="sex" name="sex" required>
          <option value="">選択してください</option>
          <option value="male">男性</option>
          <option value="female">女性</option>
          <option value="other">その他</option>
        </select>
      </div>

      <!-- 役職 -->
      <div class="field">
        <label for="role">役職</label>
        <select id="role" name="role" required>
          <option value="">選択してください</option>
          <option value="student">生徒</option>
          <option value="teacher">先生</option>
        </select>
      </div>

      <div class="error" id="error" role="alert" aria-live="polite"></div>

      <button type="submit" class="btn">登録</button>
    </form>

    <div class="footer">
      <a href="/login.html">ログイン</a>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      /* ------------------------------
         生年月日生成
      ------------------------------ */
      const yearSelect = document.getElementById("year");
      const monthSelect = document.getElementById("month");
      const daySelect = document.getElementById("day");

      const currentYear = new Date().getFullYear();
      const startYear = currentYear - 100;

      for (let y = currentYear; y >= startYear; y--) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
      }

      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        monthSelect.appendChild(opt);
      }

      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        daySelect.appendChild(opt);
      }

      /* ------------------------------
         パスワード一致チェック
      ------------------------------ */
      const form = document.getElementById("regist-form");
      const pw = document.getElementById("password");
      const pw2 = document.getElementById("password_again");
      const error = document.getElementById("error");

      form.addEventListener("submit", (e) => {
        if (pw.value !== pw2.value) {
          e.preventDefault();
          error.textContent = "パスワードが一致しません";
          pw2.focus();
        }
      });
    });
  </script>

</body>

</html>
