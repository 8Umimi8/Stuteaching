<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>プロフィール</title>

    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/profile.css}">
    <link rel="stylesheet" th:href="@{/css/main_style.css}">
    <link rel="stylesheet" th:href="@{/css/hed_style.css}">
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <div class="profile-container">

        <div class="profile-card">

            <div class="profile-avatar"></div>

            <div class="profile-section-title">表示名</div>
            <h1 th:text="${user.user_name}"></h1>


            <div class="profile-section">
                <div class="profile-section-title">基本情報</div>

                <div class="profile-info">

                    <div class="profile-label">性別</div>
                    <div class="profile-value"
                        th:text="${user.gender == 1 ? '男性' : (user.gender == 2 ? '女性' : 'どちらでもない')}">
                    </div>
                    <div class="profile-label">生年月日</div>
                    <div class="profile-value" th:text="${#dates.format(user.birthday, 'yyyy年MM月dd日')}"></div>

                    <div class="profile-label">メールアドレス</div>
                    <div class="profile-value" th:text="${user.email}"></div>
                    <!-- ロール2（先生）のときだけ表示 -->
                    <div th:if="${user.role == 2}">
                        <div class="profile-label">担当教科</div>
                        <span
                            th:text="${teacher != null && teacher.subjectId != null ? teacher.subjectId.subject_name : '未設定'}"></span>


                    </div>
                </div>
            </div>
<div class="container">

            <a th:href="@{/account/profile/edit}" class="profile-button primary">プロフィールを編集</a>
</div>
        </div>

    </div>


</body>

</html>
