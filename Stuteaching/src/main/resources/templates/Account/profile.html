<div class="profile-container">
    <!doctype html>
    <html lang="ja">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>プロフィール</title>
        <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}">
        <link rel="stylesheet" th:href="@{../css/profile.css}">
        <link rel="stylesheet" th:href="@{../css/main_style.css}">
        <link rel="stylesheet" th:href="@{../css/hed_style.css}">
    </head>

    <body>
        <div th:replace="header :: header"></div>

        <div class="profile-card">

            <div class="profile-avatar">R</div>

            <div class="profile-name" th:text="${user.name}">来栖康生</div>


            <div class="profile-section">
                <div class="profile-section-title">基本情報</div>

                <div class="profile-info">

                    <div class="profile-label">性別</div>
                    <div class="profile-value" th:text="${user.gender}">男</div>

                    <div class="profile-label">生年月日</div>
                    <div class="profile-value" th:text="${user.birthday}">2005年11月2日</div>

                    <div class="profile-label">メールアドレス</div>
                    <div class="profile-value" th:text="${user.email}">sutatin@example.com</div>

                    <div class="profile-label" style="margin-top: 16px;">担当教科</div>
                    <div class="profile-value" th:text="${user.subject}">数学</div>

                </div>
            </div>

            <button class="profile-button primary">プロフィールを編集</button>

        </div>
</div>
