<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット | Stutyching</title>

    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/hed_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div id="header"></div>
    <script>
        fetch("header.html")
            .then(res => res.text())
            .then(html => {
                document.getElementById("header").innerHTML = html;
            });
    </script>

    <!-- サイドバー -->
    <div class="sidebar" id="userList"></div>

    <!-- チャットエリア -->
    <div class="chat-area">
        <img id="emptyLogo" class="empty-logo" src="logo.jpg" alt="logo">

        <div class="chat-header" id="chatHeader"></div>
        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input">
            <input id="messageInput" type="text" placeholder="メッセージを入力..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i> 送信
            </button>
        </div>
    </div>

    <script>
        /* ----------------------------------------------------
           ★ HTMLだけで動かすための静的データ
        ---------------------------------------------------- */
        const users = [
            { id: 1, name: "あなた" },
            { id: 2, name: "宮本 さくら" }
        ];

        let messages = [];

        const myId = 1;
        let currentUserId = 2; // 最初からさくらを選択


        /* ----------------------------------------------------
           ★ ユーザー一覧を表示
        ---------------------------------------------------- */
        window.onload = () => {
            const list = document.getElementById("userList");

            users.forEach(u => {
                if (u.id === myId) return;

                const div = document.createElement("div");
                div.className = "user";
                div.setAttribute("data-user-id", u.id);
                // ユーザー名の最初の文字を取得（姓名の区切りを考慮）
                const initial = u.name.trim().charAt(0);
                div.setAttribute("data-initial", initial);
                div.textContent = u.name;
                div.onclick = () => {
                    // アクティブクラスを更新
                    document.querySelectorAll(".user").forEach(el => {
                        el.classList.remove("active");
                    });
                    div.classList.add("active");
                    loadChat(u.id, u.name);
                };
                list.appendChild(div);
            });

            // 初期表示でさくらを開く
            const firstUser = document.querySelector(`[data-user-id="2"]`);
            if (firstUser) {
                firstUser.classList.add("active");
            }
            loadChat(2, "宮本 さくら");
        };


        /* ----------------------------------------------------
           ★ チャット読み込み
        ---------------------------------------------------- */
        function loadChat(userId, name) {
            currentUserId = userId;

            // アクティブクラスを更新
            document.querySelectorAll(".user").forEach(el => {
                el.classList.remove("active");
            });
            const activeUser = document.querySelector(`[data-user-id="${userId}"]`);
            if (activeUser) {
                activeUser.classList.add("active");
            }

            document.getElementById("emptyLogo").style.display = "none";
            document.getElementById("chatHeader").style.display = "block";
            document.getElementById("chatMessages").style.display = "block";
            document.querySelector(".chat-input").style.display = "flex";

            document.getElementById("chatHeader").textContent = name;

            const area = document.getElementById("chatMessages");
            area.innerHTML = "";

            messages
                .filter(m =>
                    (m.senderId === myId && m.receiverId === userId) ||
                    (m.senderId === userId && m.receiverId === myId)
                )
                .forEach(m => {
                    const div = document.createElement("div");
                    div.className = "message " + (m.senderId === myId ? "from-me" : "from-them");
                    div.textContent = m.content;
                    area.appendChild(div);
                });

            // 最新メッセージへスクロール
            area.scrollTop = area.scrollHeight;
        }


        /* ----------------------------------------------------
           ★ メッセージ送信（HTMLだけで動く）
        ---------------------------------------------------- */
        function sendMessage() {
            const text = document.getElementById("messageInput").value.trim();
            if (!text || !currentUserId) return;

            // 自分のメッセージを追加
            messages.push({
                senderId: myId,
                receiverId: currentUserId,
                content: text
            });

            document.getElementById("messageInput").value = "";
            loadChat(currentUserId, document.getElementById("chatHeader").textContent);

            /* ----------------------------------------------------
               ★ 自動返信（宮本さくら）
            ---------------------------------------------------- */
            if (currentUserId === 2) {

                let reply = null;

                if (text.includes("こんにちは")) {
                    reply = "こんにちは！初めましてよろしくお願いします。";
                }

                if (text.includes("おはよう")) {
                    reply = "おはよう！いい一日になりそうだね。";
                }

                if (text.includes("ありがとう")) {
                    reply = "どういたしまして！";
                }

                // 返信が必要なときだけ実行
                if (reply) {
                    setTimeout(() => {
                        messages.push({
                            senderId: 2,
                            receiverId: 1,
                            content: reply
                        });
                        loadChat(currentUserId, document.getElementById("chatHeader").textContent);
                    }, 1500); // ← ここで“間”を調整
                }
            }
        }
    </script>

</body>

</html>
