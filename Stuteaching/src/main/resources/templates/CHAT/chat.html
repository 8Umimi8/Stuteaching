<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット | Stutyching</title>

    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <link rel="stylesheet" th:href="@{/css/hed_style.css}">
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}">
    <style>
        .image-preview-msg {
            display: inline-block;
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }
        .image-preview-msg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .remove-preview {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            width: 24px;
            height: 24px;
            text-align: center;
            line-height: 22px;
        }
    </style>
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<!-- サイドバー -->
<div class="sidebar">
    <div th:each="u : ${users}" th:if="${u.userId != currentUser.userId}" class="user"
         th:classappend="${u.roomId == classId} ? ' active'" th:data-initial="${u.name.substring(0,1)}"
         th:text="${u.name}" th:onclick="'location.href=\'/chat/' + ${u.roomId} + '\';'">
    </div>
</div>

<!-- チャットエリア -->
<div class="chat-area">

    <!-- ヘッダー -->
    <div class="chat-header" style="display:flex;" th:if="${chatPartner != null}">
        <div class="chat-header-title" th:text="${chatPartner.userName}">
        </div>
    </div>

    <!-- メッセージ -->
    <div class="chat-messages" th:if="${chatPartner != null}">
    </div>

    <!-- 入力欄 -->
    <form class="chat-input" th:if="${chatPartner != null}"
          th:action="@{'/chat/' + ${classId} + '/send'}"
          method="post" enctype="multipart/form-data"
          style="display:flex; align-items:center; gap:8px;">

        <button type="button" class="attach-btn" onclick="document.getElementById('imageInput').click()">
            <i class="fas fa-image"></i>
        </button>

        <input type="file" id="imageInput" name="image" accept="image/*" style="display:none;">

        <input type="text" name="messageText" placeholder="メッセージを入力..." style="flex:1;">

        <button type="submit">
            <i class="fas fa-paper-plane"></i>
            送信
        </button>
    </form>

</div>

<script th:inline="javascript">
    const currentUserId = /*[[${currentUser.userId}]]*/ 0;
    const classId = /*[[${classId}]]*/ 0;
</script>

<script>
   let lastMessageId = null;

async function loadMessages(classId) {
    const res = await fetch(`/chat/${classId}/messages`);
    const messages = await res.json();

    const area = document.querySelector(".chat-messages");

    // ---------------------------
    // 初回読み込み
    // ---------------------------
    if (lastMessageId === null) {
        messages.forEach(m => appendMessage(m, area));

        if (messages.length > 0) {
            lastMessageId = messages[messages.length - 1].classId;
        }

        // 初回は必ず最下部へ（レイアウト完了を確実に待つ）
        setTimeout(() => {
            requestAnimationFrame(() => {
                area.scrollTop = area.scrollHeight;
            });
        }, 100);

        return;
    }

    // ---------------------------
    // 差分だけ追加
    // ---------------------------
    let added = false;

    messages.forEach(m => {
        if (m.classId > lastMessageId) {
            appendMessage(m, area);
            added = true;
        }
    });

    // ---------------------------
    // 新規メッセージがあった時だけスクロール
    // ---------------------------
    if (added) {
        lastMessageId = messages[messages.length - 1].classId;

        requestAnimationFrame(() => {
            area.scrollTop = area.scrollHeight;
        });
    }
}

// ---------------------------
// メッセージ追加処理
// ---------------------------
function appendMessage(m, area) {
    const isMe = Number(m.senderId) === Number(currentUserId);

    const wrapper = document.createElement("div");
    wrapper.className = "message-wrapper " + (isMe ? "me" : "them");
    wrapper.dataset.senderId = m.senderId;

    const last = area.lastElementChild;
    const showName = !last || last.dataset.senderId != m.senderId;

    let contentHtml = "";
    if (m.imageUrl) {
        contentHtml = `<img src="${m.imageUrl}" class="chat-image">`;
    } else {
        contentHtml = `<div class="content">${m.messageText}</div>`;
    }

    wrapper.innerHTML = `
        ${showName ? `<div class="sender-name">${m.senderName}</div>` : ""}
        <div class="message ${isMe ? "from-me" : "from-them"}">
            ${contentHtml}
        </div>
    `;

    area.appendChild(wrapper);
}

// ---------------------------
// 初回読み込み
// ---------------------------
document.addEventListener("DOMContentLoaded", () => {
    if (classId > 0) loadMessages(classId);
});

// ---------------------------
// 5秒ごとに差分更新
// ---------------------------
setInterval(() => {
    if (classId > 0) loadMessages(classId);
}, 1000);
    // ------------------------------
    // 画像プレビュー
    // ------------------------------
    const imageInput = document.getElementById("imageInput");
    const chatArea = document.querySelector(".chat-messages");
    const chatForm = document.querySelector(".chat-input");
    const messageText = chatForm.querySelector('input[name="messageText"]');
    let previewWrapper = null;

    imageInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        if (previewWrapper) previewWrapper.remove();

        previewWrapper = document.createElement("div");
        previewWrapper.className = "image-preview-msg";

        const img = document.createElement("img");
        const reader = new FileReader();
        reader.onload = function (e) {
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-preview";
        removeBtn.textContent = "✖";
        removeBtn.addEventListener("click", () => {
            previewWrapper.remove();
            previewWrapper = null;
            imageInput.value = "";
            messageText.disabled = false;
        });

        previewWrapper.appendChild(img);
        previewWrapper.appendChild(removeBtn);

        chatArea.appendChild(previewWrapper);

        requestAnimationFrame(() => {
            chatArea.scrollTop = chatArea.scrollHeight;
        });

        messageText.disabled = true;
    });

    chatForm.addEventListener("submit", (e) => {
        if (imageInput.files.length > 0 && messageText.value.trim() !== "") {
            e.preventDefault();
            alert("画像と文字は同時に送信できません。どちらか一方にしてください。");
        }
    });

</script>

</body>
</html>
