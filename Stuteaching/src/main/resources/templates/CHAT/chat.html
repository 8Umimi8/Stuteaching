<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット | Stutyching</title>

    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <link rel="stylesheet" th:href="@{/css/hed_style.css}">
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}">
</head>

<body>

    <div th:replace="fragments/header :: header"></div>

    <!-- サイドバー -->
    <div class="sidebar">
        <div th:each="u : ${users}" th:if="${u.userId != currentUser.userId}" class="user"
            th:classappend="${u.roomId == classId} ? ' active'" th:data-initial="${u.name.substring(0,1)}"
            th:text="${u.name}" th:onclick="'location.href=\'/chat/' + ${u.roomId} + '\';'">
        </div>
    </div>

    <!-- チャットエリア -->
    <div class="chat-area">

        <!-- ヘッダー -->
        <div class="chat-header" style="display:flex;" th:if="${chatPartner != null}">
            <div class="chat-header-title" th:text="${chatPartner.userName}">
            </div>

            <form th:action="@{'/chat/' + ${classId} + '/rating'}" method="post" class="chat-rating-area">

                <input type="hidden" name="score" id="ratingScore">

                <span class="stars">
                    <span class="rating-star" th:each="i : ${#numbers.sequence(1,5)}"
                        th:onclick="'setRating(' + ${i} + ')'">
                        ★
                    </span>
                </span>

                <button class="rating-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>

        <!-- メッセージ（初期は Thymeleaf で描画するが、JS が上書きする） -->
        <!-- メッセージ（JS が描画する） -->
        <div class="chat-messages" th:if="${chatPartner != null}" style="display:block;">
        </div>
        <!-- 入力欄 -->
        <form class="chat-input" th:if="${chatPartner != null}" th:action="@{'/chat/' + ${classId} + '/send'}"
            method="post" enctype="multipart/form-data" style="display:flex;">

            <button type="button" class="attach-btn" onclick="document.getElementById('imageInput').click()">
                <i class="fas fa-image"></i>
            </button>

            <input type="file" id="imageInput" name="image" accept="image/*" style="display:none;">

            <input type="text" name="messageText" placeholder="メッセージを入力..." required>

            <button type="submit">
                <i class="fas fa-paper-plane"></i>
                送信
            </button>
        </form>

    </div>

    <!-- ========================= -->
    <!--        JavaScript         -->
    <!-- ========================= -->

    <script th:inline="javascript">
        const currentUserId = /*[[${currentUser.userId}]]*/ 0;
        const classId = /*[[${classId}]]*/ 0;
    </script>
    <script>
        /* ------------------------------
           メッセージ差分更新（点滅ゼロ）
        ------------------------------ */
        let lastMessageId = null;

        async function loadMessages(classId) {
            const res = await fetch(`/chat/${classId}/messages`);
            const messages = await res.json();

            const area = document.querySelector(".chat-messages");

            messages.forEach(m => {
                // すでに表示済みならスキップ
                if (lastMessageId !== null && m.classId <= lastMessageId) {
                    return;
                }

                const isMe = Number(m.senderId) === Number(currentUserId);

                const wrapper = document.createElement("div");
                wrapper.className = "message-wrapper " + (isMe ? "me" : "them");
                wrapper.dataset.senderId = m.senderId;

                // 直前のメッセージと senderId が違う場合だけ名前を表示
                const last = area.lastElementChild;
                const showName = !last || last.dataset.senderId != m.senderId;

                wrapper.innerHTML = `
            ${showName ? `<div class="sender-name">${m.senderName}</div>` : ""}
            <div class="message ${isMe ? "from-me" : "from-them"}">
                <div class="content">${m.messageText}</div>
            </div>
        `;

                area.appendChild(wrapper);
            });

            // 最後のメッセージIDを更新
            if (messages.length > 0) {
                lastMessageId = messages[messages.length - 1].classId;
            }

            area.scrollTop = area.scrollHeight;
        }

        /* 初回ロード */
        document.addEventListener("DOMContentLoaded", () => {
            if (classId > 0) {
                loadMessages(classId);
            }
        });

        /* 5秒ごとに差分更新 */
        setInterval(() => {
            if (classId > 0) {
                loadMessages(classId);
            }
        }, 1000);

        /* 星評価 */
        function setRating(score) {
            document.getElementById("ratingScore").value = score;
            document.querySelectorAll(".rating-star")
                .forEach((s, i) => s.classList.toggle("star-filled", i < score));
        }
    </script>

</body>

</html>
