<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>チャット | Stutyching</title>

    <link rel="stylesheet" th:href="@{/css/chat.css}">
    <link rel="stylesheet" th:href="@{/css/hed_style.css}">
    <link rel="stylesheet"
          th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}">
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<!-- サイドバー -->
<div class="sidebar">
    <div th:each="u : ${users}"
	     th:if="${u.userId != currentUser.userId}"
	     class="user"
	     th:classappend="${u.roomId == classId} ? ' active'"
	     th:data-initial="${u.name.substring(0,1)}"
	     th:text="${u.name}"
	     th:onclick="'location.href=\'/chat/' + ${u.roomId} + '\';'">
	</div>
</div>

<!-- チャットエリア -->
<div class="chat-area">

    <!-- ヘッダー -->
    <div class="chat-header" style="display:flex;" th:if="${chatPartner != null}">
        <div class="chat-header-title"
		     th:text="${chatPartner.user_name}">
		</div>

        <form th:action="@{'/chat/' + ${classId} + '/rating'}"
              method="post"
              class="chat-rating-area">

            <input type="hidden" name="score" id="ratingScore">

            <span class="stars">
                <span class="rating-star"
                      th:each="i : ${#numbers.sequence(1,5)}"
                      th:onclick="'setRating(' + ${i} + ')'">
                    ★
                </span>
            </span>

            <button class="rating-btn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <!-- メッセージ -->
    <div class="chat-messages" th:if="${chatPartner != null}" style="display:block;">
	    <div th:each="m, iterStat : ${messages}" 
	         class="message-wrapper"
	         th:classappend="${m.senderId == currentUser.userId} ? ' me' : ' them'">
	
	        <!-- 名前 -->
	        <div class="sender-name"
	             th:if="${iterStat.index == 0 or m.senderId != messages[iterStat.index - 1].senderId}"
	             th:text="${m.senderName}">
	        </div>
	
	        <!-- メッセージバブル -->
	        <div class="message"
	             th:classappend="${m.senderId == currentUser.userId} ? ' from-me' : ' from-them'">
	            <div class="content"
	                 th:text="${m.messageText}">
	            </div>
	        </div>
	    </div>
	</div>

    <!-- 入力欄 -->
    <form class="chat-input" th:if="${chatPartner != null}"
          th:action="@{'/chat/' + ${classId} + '/send'}"
          method="post"
          style="display:flex;">

        <button type="button"
                class="attach-btn"
                onclick="document.getElementById('imageInput').click()">
            <i class="fas fa-image"></i>
        </button>

        <input type="file"
               id="imageInput"
               name="image"
               accept="image/*"
               style="display:none;">

        <input type="text"
               name="messageText"
               placeholder="メッセージを入力..."
               required>

        <button type="submit">
            <i class="fas fa-paper-plane"></i>
            送信
        </button>
    </form>

</div>

<script>
    function setRating(score) {
        document.getElementById("ratingScore").value = score;
        document.querySelectorAll(".rating-star")
            .forEach((s, i) => s.classList.toggle("star-filled", i < score));
    }

    // 自動スクロール
    const messages = document.querySelector('.chat-messages');
    if (messages) {
        messages.scrollTop = messages.scrollHeight;
    }
document.addEventListener("DOMContentLoaded", () => {
      const hamburger = document.querySelector(".hamburger");
      const navMenu = document.querySelector(".nav-menu");

      if (hamburger && navMenu) {
        hamburger.addEventListener("click", () => {
          navMenu.classList.toggle("active");
          hamburger.classList.toggle("active");
        });
      }
    });
</script>

</body>

</html>
