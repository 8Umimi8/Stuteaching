<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マッチ | Stutyching - 学習プラットフォーム</title>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/hed_style.css}">
    <link rel="stylesheet" th:href="@{/css/home_style.css}">
</head>
<style>
    /* =========================
   通知バッジ（未読マーク）
========================= */
    .icon-btn {
        position: relative;
    }

    .icon-btn.has-notification::after {
        content: "";
        position: absolute;
        top: -3px;
        right: -3px;
        width: 10px;
        height: 10px;
        background: #ff3b30;
        /* iOS風の赤 */
        border-radius: 50%;
        box-shadow: 0 0 0 2px #fff;
        /* 白縁で視認性UP */
    }

    .btn.primary {
        display: inline-flex;
        /* テキストを自然に中央寄せ */
        align-items: center;
        /* 垂直方向の中央揃え */
        justify-content: center;
        /* 水平方向の中央揃え */
        padding: 8px 16px;
        /* 文字が潰れない余白 */
        line-height: 1;
        /* 行の高さを安定させる */
        text-decoration: none;
        /* aタグの下線を消す */
        border-radius: 6px;
        /* ボタンらしい角丸 */
    }
    .filter-panel {
    display: none; /* 初期は非表示 */
}

</style>

<body>
   <div th:replace="~{fragments/header :: header}"></div>
    <main>
        <section aria-labelledby="match-title">


            <div class="actions">
                <button class="btn" id="filterBtn">フィルター</button>
            </div>

            <div class="filter-panel" id="filterPanel">
                <h3>フィルター</h3>

                <label>教科</label>
                <select id="filterSubject">
                    <option value="">すべて</option>
                    <option value="2">数学</option>
                    <option value="3">英語</option>
                    <option value="1">国語</option>
                    <option value="4">理科</option>
                    <option value="5">社会</option>
                </select>

                <label>評価</label>
                <select id="filterRating">
                    <option value="">すべて</option>
                    <option value="5">★5</option>
                    <option value="4">★4以上</option>
                    <option value="3">★3以上</option>
                </select>

                <button class="btn primary" id="applyFilter">適用</button>
                <button class="btn" id="resetFilter">リセット</button>
            </div>

            <div class="grid" id="user-grid">

              <div class="card"
     th:each="user : ${users}"
     th:attr="data-teacher-id=${user.teacherId}, data-subject-id=${user.subjectId}">

                    <div class="card-content">

                        <!-- ユーザー名 -->
                        <h3 th:text="${user.userName}"></h3>

                        <!-- 教科 -->
                        <div class="meta">
                            <span>
                                教科:
                                <span th:text="${user.subjectName}"></span>
                            </span>
                        </div>

                        <!-- 評価（★） -->
                        <div class="rating">
                            <span th:if="${user.review != null and user.review > 0}"
                                th:each="i : ${#numbers.sequence(1, user.review)}" class="star-filled">★</span>
                            <span th:if="${user.review == null or user.review == 0}">未評価</span>
                        </div>

                        <a th:href="@{/chat/start/{teacherId}(teacherId=${user.teacherId})}" class="btn primary">
                            メッセージ
                        </a>
                    </div>
                </div>


            </div>
        </section>
    </main>


</body>

<script>


  document.addEventListener("DOMContentLoaded", () => {
    const filterBtn = document.getElementById("filterBtn");
    const filterPanel = document.getElementById("filterPanel");

    if (filterBtn && filterPanel) {
        filterBtn.addEventListener("click", () => {
            filterPanel.style.display =
                filterPanel.style.display === "block" ? "none" : "block";
        });
    }

   // フィルター適用
document.getElementById("applyFilter").addEventListener("click", () => {
    const subject = document.getElementById("filterSubject").value;
    const rating = document.getElementById("filterRating").value;

    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        const cardSubjectId = card.getAttribute("data-subject-id");
        const userRating = card.querySelectorAll(".star-filled").length;

        let show = true;
        if (subject && cardSubjectId !== subject) show = false; // 教科IDで一致確認
        if (rating && userRating < Number(rating)) show = false;

        card.style.display = show ? "block" : "none";
    });

    filterPanel.style.display = "none";
});

    // リセット
    document.getElementById("resetFilter").addEventListener("click", () => {
        document.getElementById("filterSubject").value = "";
        document.getElementById("filterRating").value = "";

        document.querySelectorAll(".card").forEach(card => {
            card.style.display = "block";
        });

        filterPanel.style.display = "none";
    });
});

</script>

</html>
