<header class="header" th:fragment="header">
    <div class="brand">

        <!-- ロゴ -->
        <div class="logo-group">
            <img th:src="@{/img/logo.jpg}" class="logo2" alt="Stutyching ロゴ">
            <div class="logo">Stutyching</div>
        </div>

        <!-- ナビゲーション -->
        <nav class="nav-menu">
    <ul>
        <li>
            <a th:href="@{/match}"
               th:classappend="${activeMenu == 'match'} ? 'active'">
                <i class="fas fa-home"></i> マッチ
            </a>
        </li>

        <li>
            <a th:href="@{/chat}"
               th:classappend="${activeMenu == 'chat'} ? 'active'">
                <i class="fas fa-comments"></i> トーク
            </a>
        </li>

        <li>
            <a th:href="@{/study-time/display}"
               th:classappend="${activeMenu == 'study'} ? 'active'">
                <i class="fas fa-clock"></i> 勉強時間管理
            </a>
        </li>

        <li>
            <a th:href="@{/account/profile}"
               th:classappend="${activeMenu == 'account'} ? 'active'">
                <i class="fas fa-user"></i> アカウント詳細
            </a>
        </li>
    </ul>
</nav>



        <!-- ユーザー操作 -->
        <div class="user-actions">

            <!-- 通知ボタン（初期バッジなし） -->
            <a th:href="@{#}" class="icon-btn" id="notifyBtn">
                <i class="fas fa-bell"></i>
            </a>

            <!-- 通知パネル -->
            <div class="notification-panel" id="notificationPanel">
                <div class="notification-title">通知</div>
                <ul class="notification-list">
                    <li th:each="note : ${notifications}" 
    th:classappend="${!note.isRead} ? 'unread' : ''"
    th:attr="data-alert-id=${note.alertId}">
    <strong th:text="${note.title}">通知タイトル</strong><br>
    <span th:text="${#temporals.format(note.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
</li>


                    <li th:if="${notifications == null or notifications.empty}" style="color:#777;">
                        通知はありません
                    </li>
                </ul>
            </div>

            <!-- ログアウトボタン -->
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="icon-btn logout-btn" title="ログアウト">
                    <i class="fas fa-right-from-bracket"></i>
                </button>
            </form>

            <!-- ハンバーガーメニュー -->
            <button class="hamburger"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <script th:src="@{/js/header.js}"></script>
   <script>
document.addEventListener("DOMContentLoaded", () => {
    const notifyBtn = document.getElementById("notifyBtn");
    const notificationPanel = document.getElementById("notificationPanel");

    if (!notifyBtn || !notificationPanel) return;

    const togglePanel = (open) => {
        notificationPanel.classList.toggle("open", open);
    };

    // 外クリックで閉じる
    document.addEventListener("pointerdown", (e) => {
        if (!notificationPanel.contains(e.target) && !notifyBtn.contains(e.target)) {
            togglePanel(false);
        }
    });

    // ページ読み込み時：未読件数があれば赤丸を表示
    const updateBadge = () => {
        const unreadCount = document.querySelectorAll(".notification-list li.unread").length;
        let badge = notifyBtn.querySelector(".notification-badge");
        if (unreadCount > 0) {
            if (!badge) {
                badge = document.createElement("span");
                badge.classList.add("notification-badge");
                notifyBtn.appendChild(badge);
            }
            badge.textContent = unreadCount;
        } else if (badge) {
            badge.remove();
        }
    };

    updateBadge(); // 初期状態でチェック

    // 通知ボタン押下時
    notifyBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const isOpening = !notificationPanel.classList.contains("open");
        togglePanel(isOpening);

        if (isOpening) {
            const unreadLis = document.querySelectorAll(".notification-list li.unread");

            if (unreadLis.length > 0) {
                const unreadIds = Array.from(unreadLis).map(li =>
                    parseInt(li.getAttribute("data-alert-id"))
                );

                fetch("/alert/read/batch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(unreadIds)
                })
                .then(res => res.json())
                .then(data => {
                    if (data.status === "OK") {
                        unreadLis.forEach(li => li.classList.remove("unread"));
                        updateBadge();
                    } else {
                        console.error(data.message);
                    }
                })
                .catch(err => console.error("通知更新エラー:", err));
            }
        }
    });
});
</script>

</header>
