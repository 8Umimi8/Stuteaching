<header class="header" th:fragment="header">
    <div class="brand">

        <!-- ロゴ -->
        <div class="logo-group">
            <img th:src="@{/img/logo.jpg}" class="logo2" alt="Stutyching ロゴ">
            <div class="logo">Stutyching</div>
        </div>

        <!-- ナビゲーション -->
        <nav class="nav-menu">
            <ul>
                <li><a th:href="@{/match}"><i class="fas fa-home"></i> マッチ</a></li>
                <li><a th:href="@{/chat}"><i class="fas fa-comments"></i> トーク</a></li>
                <li><a th:href="@{/study-time/display}"><i class="fas fa-clock"></i> 勉強時間管理</a></li>
                <li><a th:href="@{/account/profile}"><i class="fas fa-user"></i> アカウント詳細</a></li>
            </ul>
        </nav>

        <!-- ユーザー操作 -->
        <div class="user-actions">

            <!-- 通知ボタン -->
            <a th:href="@{#}" class="icon-btn" id="notifyBtn">
                <i class="fas fa-bell"></i>

                <!-- 未読が1件以上あればバッジ表示 -->
                <span th:if="${notifications.?[!isRead].size() > 0}" 
                      class="notification-badge"
                      th:text="${notifications.?[!isRead].size()}">
                </span>
            </a>

            <!-- 通知パネル -->
            <div class="notification-panel" id="notificationPanel">
                <div class="notification-title">通知</div>
                <ul class="notification-list">
                    <li th:each="note : ${notifications}" 
                        th:classappend="${!note.isRead} ? 'unread' : ''">
                        <div th:href="@{/alert/read/{id}(id=${note.alertId})}"
                           th:attr="data-alert-id=${note.alertId}">
                            <strong th:text="${note.title}">通知タイトル</strong><br>
                            <span th:text="${#temporals.format(note.createdAt, 'yyyy/MM/dd HH:mm')}"></span>
                        </div>
                    </li>

                    <li th:if="${notifications == null or notifications.empty}" style="color:#777;">
                        通知はありません
                    </li>
                </ul>
            </div>

            <!-- ログアウトボタン -->
			    <form th:action="@{/logout}" method="post">
				    <button type="submit"
				            class="icon-btn logout-btn"
				            title="ログアウト">
				        <i class="fas fa-right-from-bracket"></i>
				    </button>
				</form>


            <!-- ハンバーガーメニュー -->
            <button class="hamburger"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <!-- JS -->
    <script th:src="@{/js/header.js}"></script>
    <script>
document.addEventListener("DOMContentLoaded", () => {
  const notifyBtn = document.getElementById("notifyBtn");
  const notificationPanel = document.getElementById("notificationPanel");

  if (!notifyBtn) {
    console.error("notifyBtn が見つかりません。#notifyBtn のIDを確認してください。");
    return;
  }
  if (!notificationPanel) {
    console.error("notificationPanel が見つかりません。#notificationPanel のIDを確認してください。");
    return;
  }

  // ヘルパー: パネルが開いているか
  const isOpen = () => notificationPanel.classList.contains("open");

  // トグル（通知ボタン）
  const onNotifyClick = (e) => {
    e.stopPropagation();
    notificationPanel.classList.toggle("open");
    console.log("通知ボタン: toggle open ->", isOpen());
  };

  // パネル内クリックは伝播を止める
  const onPanelPointer = (e) => {
    e.stopPropagation();
  };

  // ドキュメント上の pointerdown（マウス/タッチ/ペン）で外クリック判定
  const onDocumentPointer = (e) => {
    // クリック／タップされたターゲットがパネル内 or ボタン内なら何もしない
    if (notificationPanel.contains(e.target) || notifyBtn.contains(e.target)) {
      // do nothing
      return;
    }
    if (isOpen()) {
      notificationPanel.classList.remove("open");
      console.log("外部クリックでパネルを閉じました");
    }
  };

  // 古いリスナがある場合に二重登録しないよう先に除去（安全）
  notifyBtn.removeEventListener("click", onNotifyClick);
  notificationPanel.removeEventListener("pointerdown", onPanelPointer);
  document.removeEventListener("pointerdown", onDocumentPointer);

  // 登録
  notifyBtn.addEventListener("click", onNotifyClick);
  notificationPanel.addEventListener("pointerdown", onPanelPointer);
  // document の pointerdown を使うとタッチでも確実にキャッチできます
  document.addEventListener("pointerdown", onDocumentPointer);
});

</script>




</header>
